<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img class="TitleImg" src="Media/Scene/Title.png">
    
    <!-- This division here is for the background, seperating the layers will help with animating it in JS later on. -->
    <div class="scene" id="scene">
        <div class="layer" data-depth="0.02"><img src="Media/Scene/Sky.png" alt=""></div>
        <div class="layer" data-depth="0.05"><img src="Media/Scene/BackCity.png" alt=""></div>
        <div class="layer" data-depth="0.10"><img src="Media/Scene/City.png" alt=""></div>
        <div class="layer" data-depth="0.18"><img src="Media/Scene/white.png" alt=""></div>
        <div class="layer" data-depth="0.20"><img src="Media/Scene/Characters.png" alt=""></div>
    </div>

    <!-- This next division is for the buttons that act as navigational tools -->
    <nav aria-label="Main menu">
        <ul class="options">
            <button>Start</button>
            <button>Characters</button>
            <button>Settings</button>
            <button>Quit</button>
        </ul>
    </nav>


    <script src="script.js"></script>//
</body>
</html>
