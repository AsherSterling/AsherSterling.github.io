<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <img class="layer" data-depth="0.25" src="Media/Scene/Title.png"> -->
    
    <!-- ------ CHOSEN INTERACTION : HOVER ----- -->

    <!-- This division here is for the background, seperating the layers will help with animating it in JS later on. -->
    <div class="scene" id="scene">
        <div class="layer" data-depth="0.02"><img src="Media/Scene/Sky.png" alt=""></div>
        <div class="layer" data-depth="0.05"><img src="Media/Scene/White.png" alt=""></div>
        <div class="layer" data-depth="0.10"><img src="Media/Scene/BackCity.png" alt=""></div>
        <div class="layer" data-depth="0.18"><img src="Media/Scene/City.png" alt=""></div>
        <div class="layer" data-depth="0.20"><img src="Media/Scene/Characters.png" alt=""></div>
        <div class="layer" data-depth="0.25"><img src="Media/Scene/Title.png" alt=""></div>
        <!-- I decided on making the tilte an Image instead and Layering it on top as well because i though it
         would help if it looked more dynamic and free flowing. -->
        <!-- The images above were created in figma and then each layers was exported seperately in it's own frame -->
        <!-- Originally I had planned on creating a multipage click interactive website that was supposed to act
         as a concept for a game. However considering the actual amount of time i had to work on this assignment i decided
         to create something simpler. -->
        <div class="gloom" id="gloom"></div>
    </div>

    <!-- This next division is for the buttons that act as navigational tools -->
   <nav aria-label="Main menu">
        <ul class="options">
            <li><button class="option" data-scene="start">Start</button></li>
            <li><button class="option" data-scene="characters">Characters</button></li>
            <li><button class="option" data-scene="settings">Settings</button></li>
            <li><button class="option" data-scene="quit">Quit</button></li>
        </ul>
        <!-- I used ul to create a list first before removing the dotted points in CSS but styling it into boxes. -->
    </nav>
    <audio id="bg-music" src="sounds/AmbienceCity.mp3" autoplay loop></audio>
    <script src="script.js"></script>//
</body>
</html>
