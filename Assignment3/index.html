<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        Puella Magi Madoka Magica
    </h1>
    
    <!-- This division here is for the background, seperating the layers will help with animating it in JS later on. -->
    <div class="scene" id="scene">
        <div class="layer" data-depth="0.02"><img src="Media/Scene/Sky.png" alt=""></div>
        <div class="layer" data-depth="0.05"><img src="Media/Scene/BackCity.png" alt=""></div>
        <div class="layer" data-depth="0.10"><img src="Media/Scene/City.png" alt=""></div>
        <div class="layer" data-depth="0.18"><img src="Media/Scene/white.png" alt=""></div>
        <div class="layer" data-depth="0.18"><img src="Media/Scene/Characters.png" alt=""></div>
    </div>

    <!-- This next division is for the  -->
    <nav aria-label="Main menu">
        <ul class="options">
            <li><button class="option" data-scene="start">Start</button></li>
            <li><button class="option" data-scene="continue">Continue</button></li>
            <li><button class="option" data-scene="gallery">Gallery</button></li>
            <li><button class="option" data-scene="settings">Settings</button></li>
        </ul>
    </nav>
</body>
</html>
